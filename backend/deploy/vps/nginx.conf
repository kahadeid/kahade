# =============================================================================
# KAHADE - NGINX PRODUCTION CONFIG
# /etc/nginx/sites-available/kahade
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m   rate=5r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

upstream kahade_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name kahade.id www.kahade.id api.kahade.id;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── API (api.kahade.id) ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kahade.id;

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.kahade.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kahade.id/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Limits ───────────────────────────────────────────────────────────────
    client_max_body_size 11M;
    limit_conn api_conn 20;

    # ── Auth endpoints (strict rate limiting) ────────────────────────────────
    location ~ ^/api/v[0-9]+/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://kahade_backend;
        include /etc/nginx/proxy_params;
    }

    # ── Webhook endpoints (no rate limit — payment gateways may burst) ───────
    location ~ ^/api/v[0-9]+/webhooks/ {
        proxy_pass http://kahade_backend;
        include /etc/nginx/proxy_params;
    }

    # ── Health check (no rate limit, no auth) ────────────────────────────────
    location ~ ^/api/v[0-9]+/health {
        proxy_pass http://kahade_backend;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    # ── Metrics (restrict to internal) ───────────────────────────────────────
    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:9090;
    }

    # ── All other API routes ─────────────────────────────────────────────────
    location / {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://kahade_backend;
        include /etc/nginx/proxy_params;
    }

    # ── Deny hidden files ────────────────────────────────────────────────────
    location ~ /\. { deny all; access_log off; log_not_found off; }
}

# ── Frontend (kahade.id) ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kahade.id www.kahade.id;

    ssl_certificate     /etc/letsencrypt/live/kahade.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kahade.id/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    root /var/www/kahade/frontend/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA: all routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
